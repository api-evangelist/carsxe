specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CarsXE
providerId: carsxe
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://carsxe.com/docs/rate-limits
sources:
  - https://carsxe.com/docs/rate-limits
  - https://carsxe.com/docs/errors
  - https://carsxe.com/pricing
  - https://carsxe.com/llms.txt
description: >-
  CarsXE limits are volume-based monthly quotas tied to the subscription, not per-second throttles.
  Replaces the 2026-05-04 scaffold, which asserted invented X-RateLimit-* headers and a 10 rpm free
  tier that CarsXE does not publish.
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
header_note: >-
  CarsXE publishes NO rate-limit response headers. There is no X-RateLimit-*, no RateLimit-*, and no
  Retry-After. The only runtime signal a caller gets is the `usage` object inside the 429 body. This
  is the material gap for an agent: it cannot see how close it is to a quota until the call that
  crosses it fails, and the docs' own advice is to track usage.remaining and to watch the dashboard.
runtime_signal:
  location: response body on 429
  shape:
    usage.current: units consumed so far this billing period (or in total for Sandbox lifetime allowances)
    usage.limit: included volume for this API on the current tier
    usage.remaining: units left before the limit; 0 when the request was rejected
  example: |
    {
      "success": false,
      "message": "API limit exceeded for market_value (6/2026). Subscription tier: starter. Current usage: 5000, Limit: 5000.",
      "usage": { "current": 5000, "limit": 5000, "remaining": 0 }
    }
responseCodes:
  quotaExceeded: 429
  planNotIncluded: 403
  serviceUnavailable: 503
throttling:
  per_second: false
  note: >-
    "There are no per-second request throttles on standard plans, but keep burst concurrency
    reasonable — extremely aggressive parallel traffic can still be rejected upstream before it
    reaches your quota."
retry_semantics:
  retryable_on_429: false
  reason: >-
    A quota 429 is not transient. Retrying with backoff never succeeds. The fix is to upgrade the
    tier, enable overage billing, wait for the period reset, or — for a bulk request — shrink the
    batch to fit usage.remaining.
  message_variants:
    - "This request requires N units. — a bulk request would exceed the limit even though current < limit; reduce the batch size"
    - "Please upgrade your tier to continue using the API. — a one-time Sandbox allowance that never resets"
    - "Enable overage billing in your dashboard billing preferences to continue with overage charges — overage was opted out"
alerts:
  channel: email to the account owner
  thresholds: [80%, 90%, 100%]
  scope: per API, against that API's included volume
limit_count: 39
