aid: carsxe
name: CarsXE
description: >-
  CarsXE is a B2B vehicle data API platform operated by PiWaves, LLC, offering VIN
  decoding, vehicle specifications, market value estimates, vehicle history, vehicle
  imagery, license plate decoding and recognition, VIN OCR, OBD fault-code decoding,
  international VIN decoding, lien and theft screening, year/make/model lookup and
  single-VIN or 10,000-VIN batch recall checks. A single OpenAPI 3.1 contract covering
  21 operations is published at api.carsxe.com/openapi.json, alongside a remote MCP
  server, an RFC 9727 api-catalog, an llms.txt index, first-party SDKs for eight
  languages, and a CLI. Designed for automotive marketplaces, dealerships, insurance,
  lending, fleet, parking and claims platforms that need programmatic access to rich,
  current vehicle data.
type: Index
