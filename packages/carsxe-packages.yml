    registry: npm
    name: carsxe-api
    url: https://www.npmjs.com/package/carsxe-api
    install: npm install carsxe-api
    repository: https://github.com/carsxe/carsxe-npm-package
    official: true
    version: 1.3.0
    published: '2026-04-02'
