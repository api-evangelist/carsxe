source: >-
  npm registry, PyPI, RubyGems, Packagist, NuGet, proxy.golang.org and JitPack metadata endpoints,
  cross-checked against https://carsxe.com/docs/integrations and the github.com/carsxe organization
note: >-
  CarsXE publishes first-party clients for eight languages. Every registry-hosted package was read
  from its registry metadata endpoint on 2026-09-05. Java and Swift are distributed from git tags
  (JitPack / Swift Package Manager) rather than a package registry, so no registry metadata endpoint
  exists for them — their version fields are null with the distribution channel recorded. There is
  no crate on crates.io. @carsxe/sdk, referenced in the Recalls Batch documentation code samples, is
  NOT published on npm (404) — the shipping Node client is carsxe-api.
