model: free-tier
note: >-
  CarsXE has no separate test-mode host, no test/live key prefix split and no fixture or simulation
  tooling. What it publishes instead is a free Sandbox subscription tier: a real key calling the
  real production endpoints against a small lifetime allowance. Every value below is published by
  CarsXE — no test values are invented here. Because Sandbox calls hit production data, there is no
  way to rehearse a call without consuming allowance; see conventions/carsxe-conventions.yml
  dry_run_mode = false.
test_live_separation:
  separate_host: false
  key_prefix_split: false
  mode_flag: false
  note: the same key and the same https://api.carsxe.com host serve every tier
sandbox_tier:
  name: Sandbox
  price_usd: 0
  quota_type: lifetime shared pool
  quota: 100 successful API calls (not monthly, does not reset)
  premium_caps_within_pool:
