          $ref: "#/components/responses/UsageLimitExceeded"
        "500":
          description: Plate recognition service error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Could not get information at this time
  /v1/vinocr:
    post:
      operationId: vinOcr
      security:
        - ApiKeyQuery: []
        - X402Payment: []
        - {}
      tags: [Recognition]
      summary: VIN OCR
      description: >-
        Extract a VIN from a photo. Send a JSON body containing an `image_url`
        field with either a URL to an image or a base64-encoded image string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_url]
              properties:
                image_url:
                  type: string
                  description: >-
                    URL to an image, or the base64 string of the image.
            example:
              image_url: https://example.com/vin-plate.jpg
      responses:
        "200":
          description: VIN extracted from the image.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  vin:
                    type: string
                  box:
                    type: object
                    additionalProperties: true
                  confidence:
                    type: number
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
              example:
                success: true
                vin: JHLRD77874C026456
                box:
                  xmin: 257
                  xmax: 1673
                  ymin: 635
                  ymax: 793
                confidence: 0.9834251403808594
                candidates:
                  - vin: JHLRD77874C026456
                    confidence: 0.9834251403808594
        "400":
          description: >-
            Missing API key, missing image, invalid image data, image
            processing failure, or no text detected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingKey:
                  value:
                    success: false
                    message: Missing API key
                missingImage:
                  value:
                    success: false
                    message: Missing image data
                invalidImage:
                  value:
                    success: false
                    message: >-
                      Invalid image data format. Must be a valid URL or base64
                      encoded string.
                noText:
                  value:
                    success: false
                    message: No text detected in the image
        "401":
          description: User with this API key is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: >-
                  User with this API key is not active. To activate update
                  your billing on https://carsxe.com/dashboard/billing
        "404":
          description: API key not found, or no valid VIN found in the image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                userNotFound:
                  value:
                    success: false
                    message: >-
                      User with this API key was not found or the API key is
                      disabled
                noVin:
                  value:
                    success: false
                    message: No valid VIN candidates found in the image
        "429":
          $ref: "#/components/responses/UsageLimitExceeded"
  /v1/ymm:
    get:
