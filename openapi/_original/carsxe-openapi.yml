                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Could not fetch data
  /v1/ymm-options:
    get:
      operationId: getYearMakeModelOptions
      security:
        - ApiKeyQuery: []
        - X402Payment: []
        - {}
      tags: [Year Make Model]
      summary: Year Make Model Options
      description: >-
        Populate Year, Make, Model, and Variant dropdown menus.
        Each response returns exactly one layer. `dimension` is optional
        — when omitted, the response shape is inferred from `make`/`model`/`year`.
        Billing: most calls cost 1 unit. `dimension=variants` with `year` + `make`
        (no `model`) costs 1 unit per model; the response includes `modelCount`.
        Required filters help you get better, more relevant results.
        `year`, `make`, and `model` can be combined for reversed lookups
        (e.g. years for a given make+model).
      parameters:
        - name: dimension
          in: query
          required: false
          schema:
            type: string
            enum: ["years", "makes", "models", "trims", "variants"]
          description: >-
            Return exactly this array when required filters are present.
            If omitted, the response is inferred automatically from
            `make`/`model`/`year`.
        - name: year
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filter to a specific manufacturing year. Required when
            filtering by `model` without `make`.
        - name: make
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filter to a specific manufacturer (e.g., Toyota, Ford,
            Lexus). Required for `dimension=models`.
        - name: model
          in: query
          required: false
          schema:
            type: string
          description: >-
            Filter to a specific model (e.g., Camry, F-150, LX).
            Required for `dimension=trims` and for `dimension=variants`
            unless both `year` and `make` are set.
        - name: trim
          in: query
          required: false
          schema:
            type: string
          description: >-
            Optional substring filter on trim names. Only applied when
            querying `dimension=trims` or `dimension=variants`.
      responses:
        "200":
          description: Distinct values for the requested (or inferred) dimension(s).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  input:
                    type: object
                    additionalProperties: true
                  message:
                    type: string
                    description: >-
                      Optional guidance when the returned layer differs from
                      the requested dimension or when explaining how to get better results.
                  years:
                    type: array
                    items:
                      type: integer
                  makes:
                    type: array
                    items:
                      type: string
                  models:
                    type: array
                    items:
                      type: string
                  trims:
                    type: array
                    items:
                      type: string
                  variants:
                    type: array
                    items:
                      type: string
                  modelCount:
                    type: integer
                    description: >-
                      Present only for bulk variants (`dimension=variants` + year + make,
                      no model). Number of distinct models, which is also the amount
                      billed — except a zero-match query, which returns 0 but still
                      bills a minimum of 1 unit.
                additionalProperties: true
              examples:
                variants:
                  summary: make+model given -> variants only
                  value:
                    success: true
                    input:
                      year: 2026
                      make: Toyota
                      model: Tacoma
                    variants:
                      - Tacoma Limited
                      - Tacoma SR
                      - Tacoma SR5
                      - Tacoma TRD Off-Road
                      - Tacoma TRD PreRunner
                      - Tacoma TRD Pro
                      - Tacoma TRD Sport
                      - Tacoma Trailhunter
                modelsForMakeOnly:
                  summary: make given, no model -> models only (one layer per response)
                  value:
                    success: true
                    input:
                      year: 2026
                      make: Toyota
                    models: ["4Runner", "Camry", "Corolla", "Tacoma", "Tundra"]
                variantsForYearAndModel:
                  summary: year+model given, no make -> variants only
                  value:
                    success: true
                    input:
                      year: 2026
                      model: Tacoma
                    variants: ["Tacoma Limited", "Tacoma SR", "Tacoma SR5", "Tacoma TRD Pro"]
                variantsForYearAndMake:
                  summary: dimension=variants with year+make -> billed per model (modelCount)
                  value:
                    success: true
                    input:
                      dimension: variants
                      year: 2025
                      make: Lexus
                    variants:
                      - ES 250
                      - ES 300h
                      - GX 550 Premium
                      - IS 300
                      - LX 600 Premium
                      - RX 350
                    modelCount: 6
                variantsFallbackToModels:
                  summary: dimension=variants with make only (no year) -> models + message
                  value:
                    success: true
                    input:
                      dimension: variants
                      make: Toyota
                    message: >-
                      To receive variants, include a model filter with this make.
                      Models are returned instead.
                    models: ["4Runner", "Camry", "Corolla", "Tacoma", "Tundra"]
                yearsForMakeModel:
                  summary: "Reversed combination: dimension=years filtered by make+model"
                  value:
                    success: true
                    input:
                      dimension: years
                      make: Lexus
                      model: TX
                    years: [2026, 2025, 2024]
        "400":
          description: >-
            Invalid dimension, invalid year, missing required filters,
            or model without make/year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidDimension:
                  value:
                    success: false
                    message: >-
                      Invalid dimension. Must be one of: years, makes,
                      models, trims, variants.
                invalidYear:
                  value:
                    success: false
                    message: >-
                      Invalid year. Provide a numeric year between 1900 and
                      the current model year plus one.
                missingMakeForModels:
                  value:
                    success: false
                    message: >-
                      A make filter is required to list models. Add make=...
                      to get better results.
                missingMakeOrModelForTrimsVariants:
                  value:
                    success: false
                    message: >-
                      Trims and variants require a make or model filter. Add
                      make=... or model=... to get better results.
                missingYearWhenModelWithoutMake:
                  value:
                    success: false
                    message: >-
                      When filtering by model without make, a year filter is
                      required. Add year=... to get better results.
                missingMakeWhenModelAmbiguous:
                  value:
                    success: false
                    message: >-
                      This model name appears under multiple makes. Add
                      make=... together with year and model to get better
                      results.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/UsageLimitExceeded"
        "500":
          description: Could not fetch data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Could not fetch data
  /obdcodesdecoder:
    get:
      operationId: decodeObdCode
      security:
        - ApiKeyQuery: []
        - X402Payment: []
        - {}
      tags: [Year Make Model]
      summary: OBD Codes Decoder
      description: Decode an OBD-II diagnostic trouble code (e.g. P0115).
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: The OBD code.
      responses:
        "200":
          description: OBD code decoded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  diagnosis:
                    type: string
                  date:
                    type: string
                  code:
                    type: string
                additionalProperties: true
              example:
                success: true
                diagnosis: Engine Coolant Temperature Circuit Malfunction
                date: "2020-07-04T21:44:39.767Z"
                code: P0115
        "400":
          description: Missing OBD code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Missing OBD code
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The OBD code could not be found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Could not find code P9999
        "429":
          $ref: "#/components/responses/UsageLimitExceeded"
  /v2/platedecoder:
    get:
      operationId: decodePlateV2
      security:
        - ApiKeyQuery: []
        - X402Payment: []
        - {}
      tags: [Plate Decoder]
      summary: License Plate Decoder (v2)
      description: |
        Decode a license plate into vehicle data across 60+ supported
        countries. `country` is an ISO 3166-1 alpha-2 code (optional for `US`).
        `state` is required for `US`, `AU` and `CA`. For Pakistan (`PK`) a
        `district` is also required for the Khyber-Pakhtunkhwa province.

        For Spain (`ES`), set `require_vin=true` to always include a VIN.
        Additional charges apply: when `require_vin=true`, the request is
        billed 2x and usage counts 2x.
      parameters:
        - name: plate
          in: query
          required: true
          schema:
            type: string
          description: The vehicle registration number or license plate number.
        - name: country
          in: query
          required: false
          schema:
            type: string
          description: >-
            ISO 3166-1 alpha-2 country code such as `AU` for Australia or `ZA`
            for South Africa. Optional for `US`.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: >-
            The two letter state code (US) such as `CA` or `NY`, an Australian
            state (e.g. `NSW`, `VIC`), or a Canadian province (e.g. `ON`).
            Required only for `US`, `AU` and `CA`.
        - name: district
          in: query
          required: false
          schema:
            type: string
          description: >-
            The district of the vehicle registration number. Required for
            Pakistan (`PK`) plates registered in the Khyber-Pakhtunkhwa
            province.
        - name: require_vin
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Only supported when `country=ES`. Set to `true` to always include a
            VIN. The request is billed 2x and usage counts 2x.
      responses:
        "200":
          description: Plate decoded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  input:
                    type: object
                    additionalProperties: true
                  description:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  trim:
                    type: string
                  vin:
                    type: string
                  year:
                    type: string
                additionalProperties: true
              example:
                success: true
                input:
                  plate: 7XER187
                  state: CA
                  country: US
                description: Kia Forte LX
                make: Kia
                model: Forte
                trim: LX
                vin: 3KPFK4A78HE103497
                style: Sedan 4D
                year: "2017"
                assembly: Mexico
                fuel_type: Gasoline
                color: White
                body_style: Sedan
                engine_size: 2.0L I4 MPI
                drive_type: FWD
                transmission: Automatic
        "400":
          description: >-
            Missing plate, or `require_vin` used with a country other than ES.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingPlate:
                  value:
                    success: false
                    message: >-
                      Missing vehicle registration number or license plate
                      number
                requireVin:
                  value:
                    success: false
                    message: >-
                      The require_vin parameter is only supported when
                      country=ES.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            Invalid state/country/district, or no data found for this plate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidState:
                  value:
                    success: false
                    message: Invalid state or country code.
                invalidDistrict:
                  value:
                    success: false
                    message: Invalid district
                notFound:
                  value:
                    success: false
                    message: >-
                      Plate searches for this country have been disabled, or No
                      data found for this plate
        "429":
          $ref: "#/components/responses/UsageLimitExceeded"
  /v2/marketvalue:
    get:
      operationId: getMarketValueV2
      security:
        - ApiKeyQuery: []
        - X402Payment: []
        - {}
      tags: [Market Value]
      summary: Vehicle Market Value (v2)
      description: >-
        Get detailed market values for a VIN, including wholesale, retail and
        trade-in values across condition tiers, with optional adjustments for
        US state, mileage and condition.
      parameters:
        - $ref: "#/components/parameters/vin"
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: The US state of the vehicle to get the market value for.
        - name: mileage
          in: query
          required: false
          schema:
            type: number
          description: >-
            The current mileage of the vehicle used to adjust the market value.
            Must be a valid numeric value.
        - name: condition
          in: query
          required: false
          schema:
            type: string
            enum: [excellent, clean, average, rough]
          description: The overall condition of the vehicle.
      responses:
        "200":
          description: Market value retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  input:
                    type: object
                    additionalProperties: true
                  publish_date:
                    type: string
                  state:
                    type: string
                  country:
                    type: string
                  model_year:
                    type: string
                  make:
                    type: string
                  model:
                    type: string
                  series:
                    type: string
                  style:
                    type: string
                  class_name:
                    type: string
                  whole_xclean:
                    type: object
                    additionalProperties: true
                  whole_clean:
                    type: object
                    additionalProperties: true
                  whole_avg:
                    type: object
                    additionalProperties: true
                  whole_rough:
                    type: object
                    additionalProperties: true
                  retail_xclean:
                    type: object
                    additionalProperties: true
                  retail_clean:
                    type: object
                    additionalProperties: true
                  retail_avg:
                    type: object
                    additionalProperties: true
                  retail_rough:
                    type: object
                    additionalProperties: true
                additionalProperties: true
              example:
                uid: FDE60872
                input:
                  vin: WBAFR7C57CC811956
                  country: US
                publish_date: 4/8/2025
                state: NT
                country: US
                model_year: "2012"
                make: BMW
                model: 5-Series
                series: 535i
                style: 4D Sedan
                class_name: Luxury Car
                whole_clean:
                  base_whole_clean: 5300
                  mileage_whole_clean: 0
                  add_deduct_whole_clean: 0
                  regional_whole_clean: 0
                retail_clean:
                  base_retail_clean: 9325
                  mileage_retail_clean: 0
                  add_deduct_retail_clean: 0
                  regional_retail_clean: 0
        "400":
          description: Missing/invalid VIN, mileage or condition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingVin:
                  value:
                    success: false
                    message: Missing vin (vehicle identification number)
                wrongLength:
                  value:
                    success: false
                    message: Wrong VIN length, must be 17 characters
                invalidCondition:
                  value:
                    success: false
                    message: >-
                      Invalid condition. Available conditions: excellent,
                      clean, average, rough
                invalidMileage:
                  value:
                    success: false
                    message: Invalid mileage. Must be a number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No data found for this VIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: No data found for this VIN
        "429":
          $ref: "#/components/responses/UsageLimitExceeded"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Upstream market value provider is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                message: Cannot access the internet at this time
components:
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
      description: Your CarsXE API key, passed as the `key` query parameter.
    X402Payment:
      type: apiKey
      in: header
      name: PAYMENT-SIGNATURE
      description: >-
        x402 payment proof for supported operations. Start without a CarsXE key
        to receive HTTP 402 payment requirements, then retry the identical
        request with the payment header produced by your x402 client. CarsXE
        also accepts the legacy X-PAYMENT header.
    RecallsBatchToken:
      type: apiKey
      in: header
      name: X-CarsXE-Batch-Token
      description: Batch-scoped token returned by an x402 Recalls Batch submission.
  parameters:
    vin:
      name: vin
      in: query
      required: true
      schema:
        type: string
        minLength: 17
        maxLength: 17
      description: The 17 character long vehicle identification number.
    format:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [json, xml]
        default: json
      description: The format of the response. One of `json` or `xml`.
    batchId:
      name: batchId
      in: query
      required: true
      schema:
        type: string
      description: The batch ID returned from the submit endpoint.
    recallsBatchToken:
      name: X-CarsXE-Batch-Token
      in: header
      required: false
      schema:
        type: string
      description: >-
        Batch-scoped token returned by an x402 submit call. Use this instead of
        the key query parameter for status, results, and download requests.
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
      required: [success, message]
      additionalProperties: true
    UsageLimitError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            usage:
              type: object
              properties:
                current:
                  type: number
                  description: Current usage in the billing period.
                limit:
                  type: number
                  description: Included quota for the billing period.
                remaining:
                  type: number
                  description: Remaining included quota.
    SuccessEnvelope:
      type: object
      description: >-
        Generic success envelope. Endpoint-specific payload fields appear at
        the top level alongside these common fields.
      properties:
        success:
          type: boolean
        input:
          type: object
          description: Echo of the input parameters specified by the query.
          additionalProperties: true
        timestamp:
          type: string
      additionalProperties: true
    SpecsResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            attributes:
              type: object
              description: >-
                A map of specifications about the VIN (year, make, model,
                trim, style, type, size, category, made_in, doors, fuel_type,
                engine, transmission, drivetrain, dimensions, pricing and
                more).
              additionalProperties: true
            colors:
              type: array
              description: >-
                Available color options based on the vehicle's year, make and
                model.
              items:
                type: object
                properties:
                  category:
                    type: string
                  name:
                    type: string
                additionalProperties: true
            equipment:
              type: object
              description: >-
                Equipment details based on the vehicle's year, make and model.
              additionalProperties: true
            warranties:
              type: array
              description: Standard vehicle warranties by type, miles and months.
              items:
                type: object
                properties:
                  type:
                    type: string
                  miles:
                    type: string
                  months:
                    type: string
                additionalProperties: true
            deepdata:
              type: object
              description: >-
                More information on the vehicle from the deep data search
                (present when `deepdata=1`).
              additionalProperties: true
  responses:
    Unauthorized:
      description: >-
        Missing API key, unknown/disabled API key, or inactive account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingKey:
              value:
                success: false
                message: Missing API key
            userNotFound:
              value:
                success: false
                message: >-
                  User with this API key was not found or the API key is
                  disabled
            userNotActive:
              value:
                success: false
                message: >-
                  User with this API key is not active. To activate update
                  your billing on https://carsxe.com/dashboard/billing
    UsageLimitExceeded:
      description: >-
        API usage limit exceeded for the current billing period.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UsageLimitError"
          example:
            success: false
            message: API usage limit exceeded
            usage:
              current: 1000
              limit: 1000
              remaining: 0
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            success: false
            message: Internal server error
