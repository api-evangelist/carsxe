        "200":
          description: Vehicle matched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  bestMatch:
                    type: object
                    additionalProperties: true
                  trimOptions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  input:
                    type: object
                    additionalProperties: true
                  timestamp:
                    type: string
                additionalProperties: true
              example:
                bestMatch:
                  make: Toyota
                  model: Camry
                  year: "2023"
                  name: XLE 4dr Sedan (3.5L 6cyl 8A)
                trimOptions: []
                success: true
                input:
                  year: "2023"
                  make: Toyota
                  model: Camry
                  trim: XLE
                timestamp: "2024-03-19T12:00:00.000Z"
        "400":
          description: Missing or invalid year, make or model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    success: false
                    message: Missing year, make, or model
                invalidYear:
                  value:
                    success: false
                    message: >-
                      Invalid year. Provide a numeric year between 1900 and the
