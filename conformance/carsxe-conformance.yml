domain_standards:
  note: >-
    Vehicle data has no dominant machine-readable interchange standard the way healthcare has FHIR
    or finance has ISO 20022, so most of this section is correctly empty — a reward-only slot, not a
    penalty. What CarsXE does declare is the identifier standards its own contract is built on.
  standards:
    - id: iso-3779-vin
      conforms: true
      evidence: >-
        The contract enforces the 17-character VIN as a first-class type — components.parameters.vin
        carries minLength 17 / maxLength 17, and the documented error catalog includes "Wrong VIN
        length, must be 17 characters" and check-digit guidance
    - id: iso-3166-1-alpha-2
      conforms: true
      evidence: >-
        decodePlateV2 requires `country` as an ISO 3166-1 alpha-2 code; the error catalog rejects
        non-ISO codes with "Invalid state or country code."
    - id: obd-ii-dtc
      conforms: true
      evidence: >-
        decodeObdCode accepts SAE J2012-shaped diagnostic trouble codes (P/B/C/U prefix, e.g. P0115,
        P0300, C1234) and returns a decoded fault description
    - id: nhtsa-recalls
      conforms: true
      evidence: >-
        Recalls and Recalls-by-YMM are sourced from NHTSA and manufacturer campaign data
        (https://carsxe.com/docs/v1/vehicle-recalls); the batch surface returns NHTSA-shaped recall
        rows with consequence and remedy fields
    - id: nmvtis
      conforms: unverified
      evidence: >-
        CarsXE writes about NMVTIS on its own blog and its History/Lien-and-Theft products cover
        title, junk, salvage and theft records, but neither the contract nor the docs declare NMVTIS
        as the source of record. Recorded as unverified rather than claimed.
