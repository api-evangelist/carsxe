tools:
  - name: get_vehicle_specs
    description: Get comprehensive vehicle specifications by VIN
    parameters: [vin]
    source_operation: openapi/carsxe-specifications-api-openapi.yml#getVehicleSpecs
  - name: decode_license_plate
    description: Decode a vehicle's license plate to get VIN and basic info
    parameters: [plate, state, country]
    source_operation: openapi/carsxe-plate-api-openapi.yml#decodePlateV2
  - name: decode_international_vin
    description: Decode an international VIN for detailed info
    parameters: [vin]
    source_operation: openapi/carsxe-specifications-api-openapi.yml#getInternationalVinDecoder
  - name: get_market_value
    description: Get estimated market value for a vehicle by VIN
    parameters: [vin, state, mileage, condition]
    source_operation: openapi/carsxe-market-value-api-openapi.yml#getMarketValueV2
  - name: get_vehicle_history
    description: Get a comprehensive vehicle history report by VIN
    parameters: [vin, format]
    source_operation: openapi/carsxe-history-api-openapi.yml#getVehicleHistory
  - name: get_vehicle_images
    description: Get vehicle images by make, model, and filters
    parameters: [make, model, year, trim, color, transparent, angle, photoType, size, license, format]
    source_operation: openapi/carsxe-images-api-openapi.yml#getVehicleImages
  - name: get_vehicle_recalls
    description: Get vehicle recall information by VIN
    parameters: [vin]
    source_operation: openapi/carsxe-recalls-api-openapi.yml#getVehicleRecalls
  - name: read_license_plate_from_image
    description: Recognize and extract license plate(s) from a vehicle image URL
    parameters: [imageUrl]
    source_operation: openapi/carsxe-recognition-api-openapi.yml#recognizePlate
  - name: extract_vin_from_image
    description: Extract the VIN from a vehicle image using OCR
    parameters: [imageUrl]
    source_operation: openapi/carsxe-recognition-api-openapi.yml#vinOcr
  - name: get_year_make_model
    description: Get comprehensive vehicle info by year, make, model, and optional trim
    parameters: [year, make, model, trim]
    source_operation: openapi/carsxe-year-make-model-api-openapi.yml#getYearMakeModel
  - name: decode_obd_code
    description: Decode an OBD code and get diagnosis information
    parameters: [code]
    source_operation: openapi/carsxe-year-make-model-api-openapi.yml#decodeObdCode
  - name: check_lien_and_theft
    description: Get lien and theft information for a vehicle by VIN
    parameters: [vin]
    source_operation: openapi/carsxe-lien-theft-api-openapi.yml#getLienTheft
